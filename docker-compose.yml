services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: any-auto-register
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      HOST: 0.0.0.0
      PORT: "8000"
      APP_RELOAD: "0"
      APP_CONDA_ENV: docker
      APP_RUNTIME_DIR: /runtime
      SOLVER_PORT: "8889"
      SOLVER_BROWSER_TYPE: chromium
    expose:
      - "8000"
      - "8889"
    volumes:
      - app_runtime:/runtime

  nginx:
    image: nginx:alpine
    container_name: any-auto-register-nginx
    restart: unless-stopped
    ports:
      - "8001:80"
    volumes:
      - ./nginx/app.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
    depends_on:
      - app

volumes:
  app_runtime:
